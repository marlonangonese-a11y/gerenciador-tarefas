# ============================================================
# Pipeline de Integração Contínua (CI)
# Sistema de Gerenciamento de Tarefas Web
#
# Gatilhos: push e pull request para develop e main
# Etapas:  instalação → testes → validação de build → SQL
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — testes e validação
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes automatizados
        run: npm test

      - name: Validar sintaxe dos arquivos JavaScript
        run: |
          for arquivo in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$arquivo"
          done

  banco:
    name: Banco de dados — validação dos scripts SQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_teste
          POSTGRES_DB: gerenciador_tarefas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Executar scripts de criação e dados iniciais
        env:
          PGPASSWORD: ci_teste
        run: |
          psql -h localhost -U postgres -d gerenciador_tarefas -f database/02_criar_tabelas.sql
          psql -h localhost -U postgres -d gerenciador_tarefas -f database/03_dados_iniciais.sql

  frontend:
    name: Frontend — validação de sintaxe
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxe dos arquivos JavaScript
        run: |
          for arquivo in frontend/js/*.js; do
            node --check "$arquivo"
          done
